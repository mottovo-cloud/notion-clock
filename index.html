<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비상식량 탁상시계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap">
<style>
:root {
  --page: #f7f7f8;
  --card-top: #a9b8ad;
  --card-mid: #6f9a80;
  --card-bot: #8fc4a3;
  --ink: #ffffff;
  --soft: rgba(255,255,255,.72);
  --chip: rgba(52,96,70,.35);
  --display: "Familjen Grotesk", "Space Grotesk", system-ui, sans-serif;
  --num: "Space Grotesk", "Familjen Grotesk", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  display: grid;
  place-items: center;
  padding: 8px;
  box-sizing: border-box;
  font-family: var(--display);
  color: var(--ink);
}
.card {
  width: 100%;
  max-width: 560px;
  box-sizing: border-box;
  border-radius: 7vw;
  padding: 7vw 6.5vw 6vw;
  background:
    radial-gradient(70% 55% at 62% 48%, rgba(70,118,90,.7), transparent 70%),
    linear-gradient(180deg, var(--card-top) 0%, var(--card-mid) 55%, var(--card-bot) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6vw 10vw -6vw rgba(110,170,135,.55);
  overflow: hidden;
  display: grid;
  gap: 4vw;
}
@media (min-width: 560px) { .card { border-radius: 40px; padding: 40px 36px 34px; gap: 22px; } }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 3vw; line-height: .9; letter-spacing: -.03em; }
.month { font-size: clamp(28px, 15vw, 84px); font-weight: 500; }
.date  { font-family: var(--num); font-size: clamp(28px, 15vw, 84px); font-weight: 400; font-variant-numeric: tabular-nums; }
.week { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); padding-block: 1vw 3vw; }
.week::before, .week::after { content: ""; position: absolute; left: -10%; right: -10%; height: 60%; border-top: 1px solid rgba(255,255,255,.22); border-radius: 50% 50% 0 0 / 40% 40% 0 0; pointer-events: none; }
.week::before { top: 42%; }
.week::after  { top: 82%; }
.d { display: grid; justify-items: center; gap: 2.2vw; text-align: center; }
.d .wd { font-size: clamp(9px, 4vw, 22px); color: var(--soft); }
.d .n { font-family: var(--num); font-size: clamp(10px, 4.6vw, 26px); width: 2.3em; height: 2.3em; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.d.today .wd { color: var(--ink); }
.d.today .n { background: rgba(58,110,80,.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); font-weight: 500; font-size: clamp(12px, 5.8vw, 32px); }
.d.edge { opacity: .35; }
.d.sun .wd { color: #ffd2d8; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 3vw; }
.time { display: flex; align-items: baseline; gap: 1.6vw; font-family: var(--num); font-variant-numeric: tabular-nums; }
.ampm { font-size: clamp(10px, 4vw, 20px); color: var(--soft); }
.hm { font-size: clamp(16px, 8vw, 40px); }
.sec { font-size: clamp(10px, 4vw, 20px); color: var(--soft); }
.colon { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .colon { animation: none; } }
.chip { background: var(--chip); border-radius: 999px; padding: 1.6vw 3.4vw; font-size: clamp(9px, 3.6vw, 18px); color: var(--ink); white-space: nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><span class="month" id="month">November</span><span class="date" id="date">11</span></div>
  <div class="week" id="week"></div>
  <div class="foot">
    <div class="time"><span class="ampm" id="ampm">PM</span><span class="hm"><span id="h">2</span><span class="colon">:</span><span id="m">07</span></span><span class="sec" id="s">00</span></div>
    <span class="chip" id="chip">2026 · Wed</span>
  </div>
</div>
<script>
(function () {
  var M = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var W = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var lift = [0, -1.2, -2.2, -2.6, -2.2, -1.2, 0];
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var lastDay = null;
  function buildWeek(d) {
    var html = "";
    for (var i = -3; i <= 3; i++) {
      var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      var cls = "d" + (i === 0 ? " today" : "") + (Math.abs(i) === 3 ? " edge" : "") + (x.getDay() === 0 ? " sun" : "");
      html += '<div class="' + cls + '" style="transform:translateY(' + lift[i + 3] + 'vw)"><span class="wd">' + W[x.getDay()] + '</span><span class="n">' + x.getDate() + '</span></div>';
    }
    $("week").innerHTML = html;
  }
  function tick() {
    var d = new Date();
    var key = d.toDateString();
    if (key !== lastDay) {
      lastDay = key;
      $("month").textContent = M[d.getMonth()];
      $("date").textContent = d.getDate();
      $("chip").textContent = d.getFullYear() + " · " + W[d.getDay()];
      buildWeek(d);
    }
    var h = d.getHours();
    $("ampm").textContent = h < 12 ? "AM" : "PM";
    $("h").textContent = (h % 12) || 12;
    $("m").textContent = pad(d.getMinutes());
    $("s").textContent = pad(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
